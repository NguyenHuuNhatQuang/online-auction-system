name: Java CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      - name: Build and Test with Maven
        # Chạy kiểm tra code style và build ra file jar (chạy luôn cả Unit Test)
        run: mvn clean package

      - name: Upload Runnable JAR Artifacts
        # Sử dụng action mặc định của GitHub để lưu lại file
        uses: actions/upload-artifact@v4
        with:
          name: auction-system-executables
          # Khai báo đường dẫn đến 2 file Fat JAR mà máy chủ ảo vừa build ra
          path: |
            server/target/server-runnable.jar
            client/target/client-runnable.jar
          # Giữ file trên kho GitHub trong 7 ngày (để tiết kiệm dung lượng miễn phí)
          retention-days: 7
